name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout runtime
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Run tests
        run: deno test

      - name: Check types
        run: deno check mod.ts denoruntime.ts noderuntime.ts
